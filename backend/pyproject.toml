[project]
name = "plantsathi-backend"
version = "0.1.0"
description = "PlantSathi AI - Plant Identification and Disease Diagnosis Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "pillow>=11.0.0",
    "numpy>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "huggingface-hub>=0.26.0",
    "safetensors>=0.4.5",
    "python-jose[cryptography]>=3.3.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_model: marks tests that require actual model weights (skipped in CI)",
    "integration: marks integration tests",
    "unit: marks unit tests",
]

[tool.hatch.build.targets.wheel]
only-include = ["app"]

