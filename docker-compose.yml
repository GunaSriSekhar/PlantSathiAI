services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      ENVIRONMENT: "production"
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8000"
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
      DATABASE_URL: "sqlite+aiosqlite:////app/data/plantsathi.db"
      HF_HOME: "/app/model_cache"
      TRANSFORMERS_CACHE: "/app/model_cache/transformers"
    volumes:
      - backend-data:/app
      - model-cache:/app/model_cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  model-cache:
